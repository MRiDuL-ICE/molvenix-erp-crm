name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        volumes:
          - postgres-data:/var/lib/postgresql/data

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          package-manager: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run API unit tests
        run: pnpm test

      - name: Lint code
        run: pnpm lint

volumes:
  postgres-data:
